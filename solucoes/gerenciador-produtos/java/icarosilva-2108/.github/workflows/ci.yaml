run-name: PRODUCT-MANAGEMENT RUNNING CI TESTS

on:
  pull_request:
  push:
    branches:
      - main
      - feature/product-management-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - run: chmod +x mvnw
      - run: ./mvnw test